name: Finalize and publish supplied conflicts 1.3.0
on:
  push:
    branches: [sviluppo-occupazione-fermate]
    paths: ['.github/workflows/finalize-conflitti-130.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-qgis-main
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/sviluppo-occupazione-fermate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: main
          path: release
      - name: Integrate and verify exact attached sources
        working-directory: source
        run: python .github/scripts/finalize_conflitti_130.py
      - name: Save finalized sources on development branch
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mic_gtfs/__init__.py mic_gtfs/README.txt mic_gtfs/metadata.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Complete exact MIC_GTFS 1.3.0 source integration'
            git push origin HEAD:sviluppo-occupazione-fermate
          fi
      - name: Build using approved publisher
        shell: python
        run: |
          import os,pathlib,subprocess,textwrap
          os.environ['SOURCE_SHA']=subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip()
          text=pathlib.Path('source/.github/workflows/publish-qgis.yml').read_text()
          head=text.index('      - name: Validate, package and update index')
          start=text.index('        run: |\n',head)+len('        run: |\n')
          end=text.index('      - name: Publish ZIP and index',start)
          exec(compile(textwrap.dedent(text[start:end]),'approved-publisher','exec'))
      - name: Publish experimental ZIP and index on main
        working-directory: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mic_gtfs.zip plugins.xml
          if [ -f mic_gtfs-build.json ]; then git add -- mic_gtfs-build.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MIC_GTFS 1.3.0 conflicts for QGIS testing'
            git push origin HEAD:main
          fi
